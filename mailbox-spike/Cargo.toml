[package]
name = "mailbox-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mail-parser = "0.11"
ammonia = "4"
# Item 7: gravar o .eml no R2 por stream, sem passar pelo wasm
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["ReadableStream", "WritableStream", "TransformStream"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1