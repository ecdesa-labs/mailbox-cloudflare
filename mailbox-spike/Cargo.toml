[package]
name = "mailbox-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mail-parser = "0.11"
ammonia = "4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1